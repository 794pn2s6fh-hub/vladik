name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Make ipabuild executable
        run: chmod +x ./ipabuild.sh

      - name: Build Erosion IPA
        run: ./ipabuild.sh

      - name: Verify Grappa build linkage
        run: |
          chmod +x ./scripts/verify_grappa_build.sh
          ./scripts/verify_grappa_build.sh ./Erosion.ipa

      - name: Verify IPA
        run: |
          echo "=== IPA files ==="
          find . -type f -name "*.ipa" -print

          IPA=$(find . -type f -name "Erosion.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: Erosion.ipa was not created"
            exit 1
          fi

          echo "Found: $IPA"

      - name: Upload Erosion IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: "**/Erosion.ipa"
          if-no-files-found: error
